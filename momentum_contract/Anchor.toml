[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
momentum = "39oqYsjuQLkFLEieaP7tisN8Bq4K8A2fS2gttKaFwTAT"

[programs.devnet]
momentum = "39oqYsjuQLkFLEieaP7tisN8Bq4K8A2fS2gttKaFwTAT"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
init-tree-state = "bun run scripts/initialize-tree-state.ts"
create-tree = "bun run scripts/create-tree.ts"
set-tree-delegate = "bun run scripts/set-tree-delegate.ts"
create-collection = "bun run scripts/create-collection.ts"
init-collection-state = "bun run scripts/initialize-collection-state.ts"
