[package]
name = "momentum"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "momentum"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
# ADR pins mpl-bubblegum = "3.0.1" but 3.0.1 does not exist on crates.io.
# 3.0.0 depends on solana-program 3.0.0 which conflicts with anchor 0.31.1
# (which pins solana-program 2.x). Downgrading to 2.1.1 which accepts
# solana-program >=1.14,<3.0 and coexists with the anchor 0.31 graph.
mpl-bubblegum = "2.1.1"
# spl-account-compression 1.x drags in solana-program 4.0 and wincode-derive
# (edition2024) — incompatible with platform-tools cargo 1.84. spl-account-
# compression 0.4.2 requires anchor-lang ^0.29 (incompatible with 0.31.1).
# Sidestep by hardcoding the program IDs in state.rs (see PROGRAM_IDS module).
